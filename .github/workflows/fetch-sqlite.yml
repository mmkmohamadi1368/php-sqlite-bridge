
name: Fetch PHP SQLite extension

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  download:
    runs-on: ubuntu-24.04

    steps:
      - name: Prepare output directory
        run: mkdir -p dist

      - name: Download available PHP 8.4 SQLite package
        run: |
          docker run --rm \
            -v "$PWD/dist:/out" \
            debian:trixie-slim \
            bash -lc '
              set -e
              export DEBIAN_FRONTEND=noninteractive
              apt-get update
              apt-get install -y ca-certificates
              cd /out
              apt-get download php8.4-sqlite3
              PKG="$(find . -maxdepth 1 -type f -name "php8.4-sqlite3_*.deb" -print -quit)"
              test -n "$PKG"
              echo "===== PACKAGE METADATA ====="
              dpkg-deb -f "$PKG" Package Version Architecture Depends
              echo "===== PHP COMMON CANDIDATE ====="
              apt-cache policy php8.4-common
              sha256sum "$PKG" > SHA256SUMS
              echo "===== OUTPUT FILES ====="
              ls -lh
            '

      - name: Upload package artifact
        uses: actions/upload-artifact@v4
        with:
          name: php84-sqlite3-debian13-amd64
          path: dist/
          retention-days: 3
